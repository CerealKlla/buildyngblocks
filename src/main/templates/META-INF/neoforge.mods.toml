license="${mod_license}"

[[mods]] #mandatory

modId="${mod_id}" #mandatory

version="${mod_version}" #mandatory

displayName="${mod_name}" #mandatory

description='''
Central package for non-mod-specific custom blocks in the Kyngdoms suite -- generic building/
utility blocks that aren't tied to any one system (settlements, quests, economy, etc.). First
block: the Roller Door, a hanging, chest-fed, redstone-driven door built from real player-chosen
blocks.
'''

[[dependencies.${mod_id}]] #optional
    modId="neoforge" #mandatory
    type="required" #mandatory
    versionRange="[${neo_version},)" #mandatory
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="nuclyus"
    type="required"
    reason="Foundation mod for shared base classes/contracts across the suite."
    ordering="AFTER"
    side="BOTH"
